<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issues &amp; Bugs — BJJ Mind Map Support</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="section">
    <div class="wrap">
      <h1>Issues &amp; bugs</h1>
      <p class="muted">Every open item in the tracker — feature requests, bug reports, and support questions, at a glance.</p>
      <div class="filter-row" id="activity-filters">
        <button type="button" class="filter-chip active" data-filter="all">All</button>
        <button type="button" class="filter-chip" data-filter="bug">Bugs</button>
        <button type="button" class="filter-chip" data-filter="feature-request">Feature requests</button>
        <button type="button" class="filter-chip" data-filter="support-question">Support questions</button>
      </div>
      <div class="issue-grid" id="issue-grid"><div class="issue-card skeleton">Loading…</div></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="/nav.js"></script>
  <script src="/common.js"></script>
  <script>SupportSiteNav.renderHeader("activity"); SupportSiteNav.renderFooter();</script>
  <script src="/activity.js"></script>
</body>
</html>
